<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GridGuard — Eskom Key Device</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@400;500;600;700;800&display=swap');
:root{--bg:#0d1117;--surf:#161b22;--bord:#21262d;--green:#3fb950;--gbg:#0d2818;--red:#f85149;--rbg:#2d0f0f;--amb:#e3b341;--abg:#2d1f00;--blue:#58a6ff;--bbg:#0d1f35;--pur:#bc8cff;--pbg:#1a0d2d;--tx:#c9d1d9;--mu:#484f58;--mono:'Share Tech Mono',monospace;--sans:'Barlow',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;max-width:420px;margin:0 auto;}
.topbar{background:var(--surf);border-bottom:1px solid var(--bord);padding:13px 17px;display:flex;align-items:center;justify-content:space-between;}
.dname{font-family:var(--mono);font-size:12px;color:var(--green);letter-spacing:1px;}.dsub{font-family:var(--mono);font-size:10px;color:var(--mu);margin-top:2px;}
.sig{display:flex;gap:3px;align-items:flex-end;}
.sb{width:4px;background:var(--green);border-radius:1px;}
.main{flex:1;padding:18px 15px;display:flex;flex-direction:column;gap:14px;}
/* NFC Zone */
.nfcz{background:var(--surf);border:2px dashed var(--bord);border-radius:18px;padding:28px 18px;text-align:center;cursor:pointer;transition:all .2s;user-select:none;}
.nfcz:active{transform:scale(.97);}
.nfcz.authed{border-color:var(--green);background:var(--gbg);box-shadow:0 0 30px rgba(63,185,80,.12);}
.nfcz.locked{border-color:var(--red);background:var(--rbg);}
.nfcicon{font-size:52px;margin-bottom:12px;}
.nfctitle{font-family:var(--mono);font-size:14px;letter-spacing:1px;margin-bottom:5px;}
.nfcsub{font-size:12px;color:var(--mu);}
/* Auth timer */
.authtimer{display:none;background:var(--gbg);border:1px solid var(--green);border-radius:12px;padding:13px 16px;text-align:center;}
.authtimer.show{display:block;}
.atlbl{font-family:var(--mono);font-size:10px;color:var(--green);letter-spacing:2px;margin-bottom:5px;}
.atval{font-family:var(--mono);font-size:34px;color:var(--green);}
.atbg{background:var(--bord);height:4px;border-radius:2px;margin-top:9px;overflow:hidden;}
.atbar{height:4px;background:var(--green);border-radius:2px;transition:width 1s linear;}
/* Relay */
.relsec{background:var(--surf);border:1px solid var(--bord);border-radius:14px;overflow:hidden;}
.relhdr{padding:11px 15px;border-bottom:1px solid var(--bord);font-family:var(--mono);font-size:10px;color:var(--mu);letter-spacing:1px;}
.relbtns{padding:11px;display:flex;flex-direction:column;gap:7px;}
.relbtn{width:100%;padding:12px 15px;background:rgba(255,255,255,.03);border:1px solid var(--bord);border-radius:9px;color:var(--tx);font-family:var(--sans);font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:9px;transition:all .15s;}
.relbtn:active{transform:scale(.98);}
.relbtn.sel,.relbtn:hover{background:var(--bbg);border-color:var(--blue);color:var(--blue);}
.ri{font-size:17px;}
.sendbtn{margin:0 11px 11px;width:calc(100% - 22px);padding:13px;background:var(--blue);border:none;border-radius:9px;color:#000;font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;display:none;transition:all .15s;}
.sendbtn:active{transform:scale(.97);}
.sendbtn.show{display:block;}
/* Incoming */
.incoming{background:var(--surf);border:1px solid var(--bord);border-radius:14px;overflow:hidden;}
.inhdr{padding:11px 15px;border-bottom:1px solid var(--bord);display:flex;align-items:center;justify-content:space-between;}
.intitle{font-family:var(--mono);font-size:10px;color:var(--mu);letter-spacing:1px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.infeed{padding:9px;display:flex;flex-direction:column;gap:5px;max-height:190px;overflow-y:auto;}
.initem{border-radius:9px;padding:9px 11px;border:1px solid var(--bord);animation:popin .3s ease;}
@keyframes popin{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.initem.crit{background:var(--rbg);border-color:var(--red);}
.initem.warn{background:var(--abg);border-color:var(--amb);}
.initem.sec{background:var(--pbg);border-color:var(--pur);}
.initem.info{background:var(--gbg);border-color:var(--green);}
.itype{font-family:var(--mono);font-size:11px;font-weight:600;margin-bottom:3px;}
.itype.crit{color:var(--red);}.itype.warn{color:var(--amb);}.itype.sec{color:var(--pur);}.itype.info{color:var(--green);}
.idet{font-size:11px;line-height:1.4;}.imeta{font-size:10px;color:var(--mu);margin-top:3px;font-family:var(--mono);}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--green);color:#000;font-family:var(--mono);font-size:12px;padding:11px 22px;border-radius:28px;transition:transform .3s;white-space:nowrap;z-index:100;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="dname">⚡ GRIDGUARD KEY</div><div class="dsub">ESKOM TECH DEVICE · EK2847</div></div>
  <div class="sig"><div class="sb" style="height:6px"></div><div class="sb" style="height:10px"></div><div class="sb" style="height:14px"></div><div class="sb" style="height:18px"></div></div>
</div>
<div class="main">
  <div class="nfcz" id="nfcz" onclick="tapKey()">
    <div class="nfcicon" id="nfcicon">📲</div>
    <div class="nfctitle" id="nfctitle">TAP TO AUTHENTICATE</div>
    <div class="nfcsub" id="nfcsub">Hold near transformer NFC reader</div>
  </div>
  <div class="authtimer" id="authtimer">
    <div class="atlbl">AUTH WINDOW OPEN</div>
    <div class="atval" id="atval">30</div>
    <div class="atbg"><div class="atbar" id="atbar" style="width:100%"></div></div>
  </div>
  <div class="relsec">
    <div class="relhdr">// RELAY MESSAGE TO TRANSFORMER UNIT & AREA</div>
    <div class="relbtns">
      <button class="relbtn" onclick="selRelay(this,'Routine check-up')"><span class="ri">🔍</span>Routine check-up</button>
      <button class="relbtn" onclick="selRelay(this,'Scheduled maintenance')"><span class="ri">🔧</span>Scheduled maintenance</button>
      <button class="relbtn" onclick="selRelay(this,'Emergency repair')"><span class="ri">⚠️</span>Emergency repair</button>
      <button class="relbtn" onclick="selRelay(this,'Safety inspection')"><span class="ri">🛡️</span>Safety inspection</button>
    </div>
    <button class="sendbtn" id="sendbtn" onclick="sendRelay()">RELAY TO AREA →</button>
  </div>
  <div class="incoming">
    <div class="inhdr"><span class="intitle">// INCOMING FROM TRANSFORMER</span><div class="dot"></div></div>
    <div class="infeed" id="infeed"><div style="text-align:center;padding:15px;font-family:var(--mono);font-size:11px;color:var(--mu)">Listening for events...</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const ch = new BroadcastChannel('gridguard_v2');
let selMsg = null, authActive = false, timerInt = null;

function tapKey() {
  if(authActive) return; authActive=true;
  const z=document.getElementById('nfcz'), icon=document.getElementById('nfcicon'),
        title=document.getElementById('nfctitle'), sub=document.getElementById('nfcsub');
  z.classList.add('authed'); icon.textContent='✅';
  title.textContent='AUTHENTICATED'; sub.textContent='Tech EK2847 · Access granted';
  document.getElementById('authtimer').classList.add('show');
  ch.postMessage({type:'RFID_AUTH',techId:'EK2847',time:Date.now()});
  localStorage.setItem('gg_rfid',JSON.stringify({techId:'EK2847',time:Date.now()}));
  showToast('✓ Auth broadcast to all devices');
  let secs=30;
  timerInt = setInterval(()=>{
    secs--; document.getElementById('atval').textContent=secs;
    document.getElementById('atbar').style.width=(secs/30*100)+'%';
    if(secs<=0){
      clearInterval(timerInt); authActive=false;
      z.classList.remove('authed'); icon.textContent='📲';
      title.textContent='TAP TO AUTHENTICATE'; sub.textContent='Hold near transformer NFC reader';
      document.getElementById('authtimer').classList.remove('show');
      document.getElementById('atbar').style.width='100%';
    }
  },1000);
}

function selRelay(btn, msg) {
  document.querySelectorAll('.relbtn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel'); selMsg=msg;
  document.getElementById('sendbtn').classList.add('show');
}

function sendRelay() {
  if(!selMsg) return;
  const p={type:'RELAY_MESSAGE',message:selMsg,techId:'EK2847',transformerId:'TRF-SW04-A',timestamp:new Date().toTimeString().slice(0,8)};
  ch.postMessage(p); localStorage.setItem('gg_relay',JSON.stringify(p));
  showToast('✓ "'+selMsg+'" relayed to area');
  document.querySelectorAll('.relbtn').forEach(b=>b.classList.remove('sel'));
  document.getElementById('sendbtn').classList.remove('show'); selMsg=null;
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

function addIn(event){
  const feed=document.getElementById('infeed');
  const ph=feed.querySelector('[style*="Listening"]');if(ph)ph.remove();
  const sm={CRITICAL:'crit','HIGH':'warn','MEDIUM':'warn','INFO':'info',crit:'crit',warn:'warn',sec:'sec',info:'info'};
  const sev=sm[(event.severity||event.sev||'').toUpperCase()]||sm[(event.severity||event.sev||'').toLowerCase()]||'info';
  const el=document.createElement('div');el.className='initem '+sev;
  el.innerHTML=`<div class="itype ${sev}">${(event.alertType||event.type||'').replace(/_/g,' ')}</div><div class="idet">${event.message||event.msg||''}</div><div class="imeta">${event.transformerId||'TRF-SW04-A'} · ${event.timestamp||new Date().toTimeString().slice(0,8)}</div>`;
  feed.insertBefore(el,feed.firstChild);
  if((sev==='crit'||sev==='sec')&&navigator.vibrate)navigator.vibrate([200,100,200]);
}

ch.onmessage=e=>{if(e.data.type==='GRID_EVENT')addIn(e.data.event);};
window.addEventListener('storage',e=>{
  if(e.key==='gg_last'){try{addIn(JSON.parse(e.newValue));}catch(err){}}
});
try{const ex=JSON.parse(localStorage.getItem('gg_events')||'[]');ex.slice(0,3).reverse().forEach(addIn);}catch(e){}
</script>
</body>
</html>
